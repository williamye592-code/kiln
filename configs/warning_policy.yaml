# Warning policy configuration for EAAI event-level evaluation

input_path: "outputs/predictions/risk_dataset_with_all_scores.csv"
output_dir: "outputs/policy_eval"

time_col: "timestamp"
split_col: "split"
period_type_col: "period_type"
event_id_col: "event_id"

# For now we evaluate two available scores:
# co_relative = current deviation score
# risk_target = oracle future-risk score, used only as a sanity upper bound
score_columns:
  - co_relative
  - risk_target
  - rf_score
  - hgnn_score

# Later we will add:
# - rf_score
# - hgnn_score
# - transformer_score
# - fusion_score

splits:
  - val
  - test

period_types:
  - all
  - event_rich
  - normal_operation

thresholds:
  - 0.005
  - 0.01
  - 0.02
  - 0.05
  - 0.10
  - 0.15
  - 0.20
  - 0.30
  - 0.40
  - 0.50
  - 0.60

merge_gap_minutes:
  - 30

cooldown_minutes:
  - 30

max_window_minutes:
  - 120

# A warning is counted as detecting an event if it starts before the event
# and overlaps the pre-event actionable horizon.
lead_horizon_minutes: 240
min_lead_minutes: 30
